#
# Lightweight CI for forks.
#
# The main `ci.yml` workflow is tied to the apache/airflow infrastructure
# (self-hosted runners, the build-image registry, committer allow-list, etc.)
# and does not run cleanly on a fork. This workflow gives fork contributors
# the fast feedback recommended by contributing-docs/05_pull_requests.rst:
# pre-commit static checks, a sanity Python import / test-collection pass,
# and a Codecov upload hook.
#
# To enable Codecov on your fork:
#   1. Sign in at https://codecov.io with your GitHub account.
#   2. Add your fork (it's free for public repos).
#   3. (Optional) Add CODECOV_TOKEN as a repo secret; not required for public
#      repos but avoids occasional rate-limited uploads.
---
name: Fork CI

on:  # yamllint disable-line rule:truthy
  push:
    branches-ignore:
      - 'main'
      - 'v[0-9]+-[0-9]+-test'
      - 'v[0-9]+-[0-9]+-stable'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks (pre-commit subset)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install pre-commit
        run: pip install --upgrade pip pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The full Airflow pre-commit suite is heavy (Docker-based hooks, mypy,
      # provider scanners). On forks we run a fast, language-agnostic subset
      # so contributors get sub-5-minute feedback on the obvious issues.
      - name: Run fast pre-commit hooks
        run: |
          pre-commit run --all-files --show-diff-on-failure \
            check-merge-conflict \
            check-executables-have-shebangs \
            check-xml \
            check-yaml \
            debug-statements \
            end-of-file-fixer \
            mixed-line-ending \
            trailing-whitespace \
            python-no-log-warn

  sanity-tests:
    name: Sanity tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install pytest tooling
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov coverage

      # We deliberately don't `pip install -e .` here — the full Airflow
      # install graph requires Breeze / Docker. Test collection still catches
      # syntax errors and import-time failures in changed test modules.
      - name: Collect tests
        run: |
          pytest --collect-only -q tests/ \
            --ignore=tests/providers \
            --ignore=tests/integration \
            --ignore=tests/system \
            || echo "::warning::Test collection failed — fork CI is informational"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
